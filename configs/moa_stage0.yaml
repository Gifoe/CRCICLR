schema_version: moa-eeg-stage0-v1
project_root: /root/autodl-tmp/hsc_tta_eeg
dataset:
  eegmmidb:
    processed_glob: data/processed/eegmmidb/eegmmidb_*.h5
    task: four_class_motor_imagery
    runs: [4, 6, 8, 10, 12, 14]
    sampling_rate_hz: 160
    window_seconds: 4
    acquisition_reference: unresolved_in_physionet_edf
    reference_neutralization: CAR64
  isruc:
    status: official_download_requested
    required_channels: [F3-A2, C3-A2, O1-A2, F4-A1, C4-A1, O2-A1]
canonical_basis:
  dimension: 32
  centers: fixed_fibonacci_scalp_cap
  bandwidth: 0.55
  grid_size: 2048
  ridge: 1.0e-10
lifting:
  alpha_grid: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
  selected_alpha: 1.0e-2
model:
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.1
  patch_size: 160
training:
  seeds: [0, 1, 2]
  expansion_seeds: [3, 4]
  epochs: 20
  batch_size: 128
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  patience: 5
  num_workers: 0
split:
  seed: 2027
  train_fraction: 0.65
  validation_fraction: 0.15
gate:
  A_drop_pp: 2.0
  A_rei: 0.08
  B_gain_pp: 1.5
  C_abs_spearman: 0.3
  D_matched_tolerance_pp: -1.0
