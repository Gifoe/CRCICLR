schema_version: moa-eeg-stage0-v2
project_root: /root/autodl-tmp/hsc_tta_eeg
dataset:
  eegmmidb:
    processed_glob: data/processed/eegmmidb/eegmmidb_*.h5
    task: binary_left_vs_right_motor_imagery
    included_runs: [4, 8, 12]
    excluded_runs: [6, 10, 14]
    sampling_rate_hz: 160
    window_seconds: 4
    acquisition_reference: unresolved_in_physionet_edf
    reference_neutralization: CAR64
  isruc:
    status: DATA_NOT_LOCALLY_VERIFIED
canonical_basis:
  dimension: 32
  centers: fixed_fibonacci_scalp_cap
  bandwidth: 0.55
  grid_size: 2048
  ridge: 1.0e-10
lifting:
  selected_alpha: 1.0e-2
model:
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  patch_size: 160
training:
  seeds: [0, 1, 2]
  epochs: 12
  batch_size: 128
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  patience: 3
  num_workers: 0
gate0:
  epochs: 12
  tiny_trials: 64
  tiny_batch_size: 32
  tiny_epochs: 100
  tiny_target: 0.95
gates:
  A_mean_drop_pp: 2.0
  A_family_drop_pp: 1.5
  B_gain_pp: 1.5
split:
  seed: 2027
  train_fraction: 0.65
  validation_fraction: 0.15
