[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsc-tta"
version = "0.1.0"
description = "CPU statistical core and data pipeline for Hierarchical Subject-Certified TTA in EEG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "pyarrow>=14,<22",
  "PyYAML>=6,<7",
  "pydantic>=2.5,<3",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "mord>=0.7,<1",
]

[project.optional-dependencies]
eeg = ["mne>=1.6,<2", "pyedflib>=0.1.36,<1", "wfdb>=4.1,<5", "h5py>=3.10,<4", "zarr>=2.16,<4", "numcodecs>=0.12,<1"]
test = ["pytest>=7.4,<9", "pytest-cov>=4.1,<7"]
report = ["matplotlib>=3.8,<4", "statsmodels>=0.14,<1", "rich>=13.7,<15", "tqdm>=4.66,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["hsc_tta"]
